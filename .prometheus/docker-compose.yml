services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: wg-relay-victoriametrics
    command:
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=180d'
      - '-promscrape.config=/etc/scrape.yml'
      - '-httpListenAddr=:8428'
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - ./scrape.yml:/etc/scrape.yml:ro
      - victoriametrics_data:/victoria-metrics-data
    networks:
      - monitoring

  vmalert:
    image: victoriametrics/vmalert:v1.153.0
    container_name: wg-relay-vmalert
    command:
      - '-rule=/etc/rules/*.yml'
      - '-datasource.url=http://victoriametrics:8428'
      - '-remoteWrite.url=http://victoriametrics:8428'
      - '-remoteRead.url=http://victoriametrics:8428'
      - '-evaluationInterval=1m'
      - '-httpListenAddr=:8880'
    restart: unless-stopped
    depends_on:
      - victoriametrics
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ./rules:/etc/rules:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.3
    container_name: wg-relay-grafana
    restart: unless-stopped
    depends_on:
      - victoriametrics
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring

volumes:
  victoriametrics_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
